[package]
name = "terrustrial"
version = "0.2.0"
edition = "2021"
description = "Geostatistics in Rust: joint kriging and simulation with explicit resource and numerical contracts, plus the original estimation API and Quick Sampling"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cutlerjake/terrustrial"
readme = "README.md"
categories = ["science", "science::geo", "algorithms", "mathematics"]
keywords = ["geostatistics", "kriging", "variogram", "simulation", "geospatial"]
exclude = [
    "/assets/",
    "/benchmark-results/",
    "/crates/",
    "/scripts/",
    "/UPDATE-NOTES.md",
    "*.sqlite",
    "*.sqlite-wal",
    "*.sqlite-shm",
    "*.sqlite-journal",
]

[profile.release]
debug = true
lto = "fat"
incremental = true

[features]

[dependencies]
terrustrial-core = { version = "0.2.0", path = "crates/terrustrial-core" }

# Linalg
faer = "0.24.4"
dyn-stack = "0.13.2"

# Math
rand = "0.10.3"
rand_distr = "0.6.0"
num-traits = "0.2.19"
ultraviolet = { version = "0.10.0", features = ["f64", "mint"] }

# Utils
serde = { version = "1.0.229", features = ["derive"] }
ordered-float = "5.5.0"
itertools = "0.15.0"
permutation = "0.4.1"
indicatif = { version = "0.18.6", features = ["rayon"] }
rayon = "1.12.0"
csv = "1.4.0"
# Legacy ultraviolet 0.10 exposes wide 0.7 types. terrustrial-core does not use it.
wide = "0.7.33"

# FFT for Quick Sampling
rustfft = "6.4.1"
realfft = "3.5.0"
num-complex = "0.4.6"

[workspace]
members = ["crates/terrustrial-core"]
resolver = "2"
