[package]
name = "terrustrial"
version = "0.2.0"
edition = "2021"
description = "Geostatistics in Rust: joint kriging and simulation with explicit resource and numerical contracts, plus Quick Sampling multiple-point simulation"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cutlerjake/terrustrial"
readme = "README.md"
categories = ["science", "science::geo", "algorithms", "mathematics"]
keywords = ["geostatistics", "kriging", "variogram", "simulation", "geospatial"]
exclude = [
    "/assets/",
    "/benchmark-results/",
    "/crates/",
    "/scripts/",
    "/UPDATE-NOTES.md",
    "*.sqlite",
    "*.sqlite-wal",
    "*.sqlite-shm",
    "*.sqlite-journal",
]

[profile.release]
debug = true
lto = "fat"
incremental = true

# Every feature forwards to terrustrial-core; this crate adds no code behind them.
[features]
default = []
sqlite = ["terrustrial-core/sqlite"]
fft = ["terrustrial-core/fft"]
gpu = ["terrustrial-core/gpu"]
mi-allocator = ["terrustrial-core/mi-allocator"]
profiling = ["terrustrial-core/profiling"]
experimental-two-phase = ["terrustrial-core/experimental-two-phase"]

[dependencies]
terrustrial-core = { version = "0.2.0", path = "crates/terrustrial-core" }

# Quick Sampling (the qs module)
rand = "0.10.3"
rayon = "1.12.0"
rustfft = "6.4.1"
realfft = "3.5.0"
num-complex = "0.4.6"

[workspace]
members = ["crates/terrustrial-core"]
resolver = "2"
